; ==============================================================================
; NALA SMART HOME - ESP32-S3 2.8" LCD WALL PANEL & INTERCOM
; Phase 3: Main Firmware (LVGL 8/9, WebSockets Client, ES8311 Audio, NVS Config)
; Target Board: LCDWiki ES3C28P (ESP32-S3R8, 16MB Flash, 8MB PSRAM)
; ==============================================================================

[platformio]
default_envs = esp32s3_panel

[env:esp32s3_panel]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = partitions.csv

; Cấu hình USB CDC & Serial JTAG phần cứng an toàn
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 921600

lib_deps = 
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.3.11
    gilmaimon/ArduinoWebsockets@^0.5.4
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.4

lib_extra_dirs = 
    C:/Users/phamn/Documents/Arduino/libraries
