id="intercomModal">
        <div class="modal-box" style="max-width: 620px;">
            <div class="modal-header">
                <div class="modal-title">
                    <span>🎙️ Trung Tâm Đàm Thoại Nội Bộ Intercom</span>
                </div>
                <button class="btn-close" onclick="closeIntercomModal()">&times;</button>
            </div>

            <div class="modal-body" style="padding: 24px;">
                <!-- Trạng thái Loa Web Admin & Giám sát -->
                <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        <div style="font-weight: 600; font-size: 14px; color: #f1f5f9; display: flex; align-items: center; gap: 8px;">
                            <span>🔊 Loa Trực Tiếp Trên Trình Duyệt</span>
                            <span id="speakerLiveBadge" style="font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #334155; color: #94a3b8;">Đang tắt</span>
                        </div>
                        <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Nghe tiếng đàm thoại từ các phòng phát lên hệ thống theo thời gian thực.</div>
                    </div>
                    <button id="btnToggleWebSpeaker" onclick="toggleWebSpeaker()" style="padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; background: #10b981; color: #fff; transition: all 0.2s;">
                        🔊 Bật Loa Nghe
                    </button>
                </div>

                <!-- Chọn kênh đàm thoại -->
                <div style="margin-bottom: 20px;">
                    <div style="font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 10px;">Chọn Kênh Đàm Thoại Đích:</div>
                    <div id="intercomTargetsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px;">
                        <button class="intercom-chan-btn active" data-target="255" onclick="selectIntercomTarget(255)">
                            <span style="font-size: 20px;">📢</span>
                            <span>Toàn Nhà</span>
                            <span style="font-size: 10px; color: #34d399;">(Broadcast 0xFF)</span>
                        </button>
                    </div>
                </div>

                <!-- Nút Push-to-Talk (PTT) Lớn -->
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0;">
                    <button id="btnWebPtt" 
                            style="width: 140px; height: 140px; border-radius: 50%; border: 4px solid #10b981; background: radial-gradient(circle, #059669 0%, #047857 100%); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); user-select: none; transition: transform 0.1s, box-shadow 0.2s;">
                        <span style="font-size: 36px;">🎙️</span>
                        <span>BẤM GIỮ ĐỂ NÓI</span>
                    </button>
                    <div id="pttStatusLabel" style="margin-top: 14px; font-size: 13px; font-weight: 600; color: #94a3b8;">
                        Chạm hoặc giữ chuột để đàm thoại
                    </div>
                </div>
            </div>

            <div class="modal-footer" style="padding: 16px 24px; background: #182234; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end;">
                <button type="button" class="btn-cancel" onclick="closeIntercomModal()">Đóng</button>
            </div>
        </div>
    </div>
